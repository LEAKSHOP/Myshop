<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h2>🔐 Вход</h2>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            <form method="post">
                <input type="text" name="username" placeholder="Логин" required>
                <input type="password" name="password" placeholder="Пароль" required>
                <button type="submit">Войти</button>
            </form>
            <p style="text-align:center;margin-top:15px;color:#8892a8;">Нет аккаунта? <a href="/register" style="color:#4f8cf7;">Зарегистрируйся</a></p>
        </div>
    </div>
</body>
</html>
